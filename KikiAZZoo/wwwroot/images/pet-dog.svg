<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="dogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="50" fill="url(#dogGrad)" opacity="0.15"/>
  <!-- Dog Face Group -->
  <g transform="translate(10, 10)">
    <!-- Ears -->
    <path d="M 25,30 C 15,20 10,40 15,55 C 20,70 30,60 30,45 Z" fill="#c2410c"/>
    <path d="M 75,30 C 85,20 90,40 85,55 C 80,70 70,60 70,45 Z" fill="#c2410c"/>
    <!-- Head Base -->
    <ellipse cx="50" cy="50" rx="32" ry="26" fill="#ea580c"/>
    <!-- Snout -->
    <ellipse cx="50" cy="58" rx="16" ry="12" fill="#fff"/>
    <!-- Nose -->
    <path d="M 45,54 C 45,54 50,49 50,49 C 50,49 55,54 55,54 C 55,57 45,57 45,54 Z" fill="#1e293b"/>
    <!-- Eyes -->
    <circle cx="38" cy="45" r="4" fill="#1e293b"/>
    <circle cx="62" cy="45" r="4" fill="#1e293b"/>
    <circle cx="39" cy="44" r="1" fill="#fff"/>
    <circle cx="63" cy="44" r="1" fill="#fff"/>
    <!-- Mouth -->
    <path d="M 46,62 Q 50,65 54,62" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Cute Cheeks -->
    <circle cx="30" cy="53" r="3" fill="#f87171" opacity="0.6"/>
    <circle cx="70" cy="53" r="3" fill="#f87171" opacity="0.6"/>
  </g>
</svg>

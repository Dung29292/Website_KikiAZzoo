<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="50" fill="url(#foodGrad)" opacity="0.15"/>
  <!-- Food Bag/Bowl Group -->
  <g transform="translate(20, 20)">
    <!-- Food Bag -->
    <path d="M 20,20 L 60,20 L 55,75 L 25,75 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>
    <!-- Folded top -->
    <path d="M 20,20 L 15,10 L 65,10 L 60,20 Z" fill="#d97706" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Label -->
    <rect x="27" y="35" width="26" height="24" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Bone icon on label -->
    <path d="M 35,47 Q 37,44 40,47 Q 43,44 45,47 L 45,49 Q 43,52 40,49 Q 37,52 35,49 Z" fill="#ea580c"/>
    <!-- Food Bowl -->
    <path d="M 45,70 C 45,70 35,85 55,85 C 75,85 65,70 65,70 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" opacity="0.9"/>
    <ellipse cx="55" cy="71" rx="10" ry="3" fill="#1d4ed8"/>
  </g>
</svg>
